<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="todo-app">
        <h1>My To-Do List</h1>
        <form id="todoForm">
            <input type="text" name="todoInput" id="todoInput" placeholder="Enter a task" >
            <button type="submit">Add Task</button>
        </form>
        <p id="totalCounter">Total tasks: 0</p>
        <p id="taskCounter">Tasks remaining: 0</p>
        <ul id="todoList"></ul>
    </main>
</body>
</html>
